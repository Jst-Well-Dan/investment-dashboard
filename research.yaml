# =============================================================================
# Dan's Investment Dashboard · 唯一事实源
# -----------------------------------------------------------------------------
# 首页的「今日概览」「在跟踪的判断」「研究档案」，以及每个托管页的顶栏信息，
# 全部从这里生成。改这个文件 → 跑 build.bat → 全站同步，不需要改任何代码。
#
# 字段说明见 README.md「研究清单字段」。新增一项研究的步骤：
#   1) 在 research: 下加一条
#   2) 若是本地 HTML，填 source: 原始文件绝对路径（构建时复制并清洗）
#   3) 若是已上线的独立站点，填 url: 完整 https 地址 + external: true
#   4) 跑 build.bat
# =============================================================================

site:
  title: Dan's Investment Dashboard
  subtitle: 研究入口 · 每日复盘
  author: Dan
  # Pages 地址（用于 README 和分享链接；不影响站内相对路径）
  base_url: https://jst-well-dan.github.io/investment-dashboard/
  disclaimer: 本站为个人研究记录，所有数字与结论仅供自己复盘使用，不构成投资建议。

# 主题标签（条目上的分类，用于档案页搜索与标签展示）
topics:
  - 市场与制度
  - AI 产业链
  - 个股研究
  - 方法论

# 作用域：研究档案按这三段组织，顺序 = 这里的顺序。
# 没有 scope 的分组不进档案（例如 market：只作为「今日看板」的数据来源）。

scopes:
  - id: sector
    name: 板块研究
    intro: 先看一条产业链走到哪一步，再落到具体环节。
  - id: stock
    name: 个股研究
    intro: 同一套口径切不同角度，同一只股票可以从共识、估值、结构三个方向横切。
  - id: method
    name: 方法论
    intro: 拆解与归因的口径、恒等式与可复用工具。

# 分组：同一个 group 的研究在档案里聚成一组，并生成一个分组总览页（research/<group>/）。
# research[].kind：dashboard=持续更新看板 / report=一次性研究 / tracker=定期补数
# scope 缺省 = 不进档案（只出现在今日看板页）。

groups:
  - id: market
    name: 市场看板
    topic: 市场与制度
    intro: 每天/每交易日自动更新的看板，各自独立部署，本站只做入口。
  - id: ai-chain
    name: AI 产业链
    topic: AI 产业链
    scope: sector
    intro: 从一个环节的成本与预期，看 AI 资本开支周期走到了哪一步。
  - id: 300308
    name: 中际旭创
    code: 300308.SZ
    topic: 个股研究
    scope: stock
    intro: 光模块龙头。同一组数据切成不同角度：共识怎么被修上去、估值走到哪个分位、股价涨的是业绩还是倍数。
  - id: 300502
    name: 新易盛
    code: 300502.SZ
    topic: 个股研究
    scope: stock
    intro: 光模块二线龙头，与中际旭创互为参照（同样的归因与共识口径，便于横向比）。
  - id: method
    name: 方法论
    topic: 方法论
    scope: method
    intro: 拆解与归因的口径、恒等式与可复用工具。


  - id: ai-capex
    group: ai-chain
    title: AI 资本开支 · 指引追踪
    short: Capex 追踪
    kind: tracker
    topics: [AI 产业链]
    source: E:/Python_Doc/Investment/20261030 capex_tracker/capex_tracker.html
    slug: capex
    date: 2026-11-06
    data_asof: 2026-10-29
    preview: {file: ai-capex.png, caption: 历史资本开支与未来路径}
    summary: 事前指引 × 事后实际 × 自由现金流，逐季可复现。四家 2026 指引合计 730bn；同公司组年内上修 +10.9%，低于 2025 的 +18.8% —— 上修还在，力度在收敛。
    theses:
      - claim: 北美四家 2027 年 capex 增速仍在上修，但年内上修幅度已从 +18.8% 收窄到 +10.9%，指引的边际信息量在下降。
        status: 跟踪中
        origin: ai            # AI 初稿，待 Dan 重写后删掉此行
        next_check: 2026-12-31
        note: 看 Q4 财报季是否出现首次下修；若出现，AI 链的估值锚要换到 FCF 而非指引。

  # -------------------------------------------------------------- 中际旭创
  - id: 300308-attribution
    group: 300308
    title: 中际旭创 · 股价事后归因（2023–2026）
    short: 事后归因
    kind: report
    topics: [个股研究, 方法论]
    source: E:/Python_Doc/Investment_Workflow/8-个股研究/20261011 光模块/30_页面/report_300308_attribution.html
    slug: attribution
    date: 2026-11-06
    data_asof: 2026-10-26
    summary: 市值 = 远期共识净利 × PE_NTM，每一层都恒等、残差为 0。自动切出 17 段路径逐段看瀑布：涨的时候到底是共识在动、还是倍数在动。
    theses:
      - claim: 2024-11 之后共识线的上涨大部分是日历滚动（w 递减 × FY2−FY1），不是分析师改模型；把「线在动」读成「预期在动」会系统性高估景气。
        status: 成立
        origin: ai            # AI 初稿，待 Dan 重写后删掉此行
        next_check: 2027-01-31
        note: 已在阶段切分页验证（B/C 段切点即由此确定）。

  - id: 300308-consensus
    group: 300308
    title: 中际旭创 · 共识演化与估值分位
    short: 共识与估值
    kind: report
    topics: [个股研究]
    source: E:/Python_Doc/Investment_Workflow/8-个股研究/20261011 光模块/30_页面/report_300308_consensus.html
    slug: consensus
    date: 2026-11-04
    data_asof: 2026-10-26
    summary: NTM 共识净利 598.2 亿（21 家券商），PE_NTM 11.71x，滚动 250 日分位 0.0%。共识中位始终低估实际（同一天比低 31.6%），但低分位不等于低估 —— 分母仍然是预测。
    theses:
      - claim: 当前 11.7x 的 PE_NTM 已在近一年最低分位，若 FY2027 共识 655 亿不被下修，估值继续压缩的空间有限，风险转移到盈利端。
        status: 跟踪中
        origin: ai            # AI 初稿，待 Dan 重写后删掉此行
        next_check: 2026-12-31
        note: 触发条件——FY2027 共识出现首次连续两月下修，则本条证伪。

  - id: 300308-gk
    group: 300308
    title: 中际旭创 · 股东总回报三因子归因
    short: TSR 归因
    kind: report
    topics: [个股研究, 方法论]
    source: E:/Python_Doc/Investment_Workflow/8-个股研究/20261011 光模块/30_页面/report_300308_gk.html
    slug: gk
    date: 2026-11-08
    data_asof: 2026-10-26
    preview: {file: 300308-gk.png, caption: 股价、共识与倍数指数化走势}
    summary: 股东总回报 +2795%（×28.9）：盈利 +367.3pp、估值 -27.0pp、股息 -3.75pp。三年 28.9 倍里，倍数其实在拖后腿 —— 涨的是盈利，不是估值。
    theses:
      - claim: 旭创的 28.9 倍来自 E_NTM ×39.4、PE_NTM ×0.76。这意味着「涨太多所以会跌」在本例中不成立：倍数已经压到 11.7x，若盈利不下修，估值并不构成下跌理由。
        status: 跟踪中
        origin: ai            # AI 初稿，待 Dan 重写后删掉此行
        next_check: 2026-12-31
        note: 反证条件：出现盈利下修且倍数同时压缩。

  - id: 300308-stages
    group: 300308
    title: 中际旭创 · 阶段切分（2024 年以来）
    short: 阶段切分
    kind: report
    topics: [个股研究, 方法论]
    source: E:/Python_Doc/Investment_Workflow/8-个股研究/20261011 光模块/30_页面/report_300308_stages.html
    slug: stages
    date: 2026-11-04
    data_asof: 2026-10-26
    summary: 切点只服从一件事 —— ΔPE 与 ΔNTM 的相对符号变了。六段里这个符号组合没有一段重复：估值压缩小于盈利上修是「消化」，大于就是「否定」。
    theses:
      - claim: 2025-04-22 是三年里唯一一次真下修落地、同时 PE 处于全样本最低区（8.16）的时点；此后三个月估值 +303%。「下修落地 = 底部」这条经验值不值得重复使用，要看下一次下修。
        status: 跟踪中
        origin: ai            # AI 初稿，待 Dan 重写后删掉此行
        next_check: 2027-03-31
        note: 单次事件，样本量为 1，只能当假设，不能当规则。


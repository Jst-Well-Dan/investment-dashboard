  # ---------------------------------------------------------------- 方法论
  - id: tsr-identity
    group: method
    title: 股东总回报三因子恒等式
    short: TSR 恒等式
    kind: report
    topics: [方法论]
    url: research/300308/gk.html
    date: 2026-11-06
    data_asof: 2026-10-26
    summary: Δln(1+TSR) = 股息 + Δln(E_NTM) + Δln(PE_NTM)，三项同日、同预测集，残差恒为 0。所有个股页都用这一把尺，所以不同股票的分解结果可以直接相加比较。
    note: 这是一个入口条目，正文在「中际旭创 · 股东总回报三因子归因」页里；换股票只换数据，不改口径。

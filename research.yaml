    theses:
      - claim: 北美四家 2027 年 capex 增速仍在上修，但年内上修幅度已从 +18.8% 收窄到 +10.9%，指引的边际信息量在下降。
        status: 跟踪中
        origin: ai            # AI 初稿，待 Dan 重写后删掉此行
        next_check: 2026-12-31
        note: 看 Q4 财报季是否出现首次下修；若出现，AI 链的估值锚要换到 FCF 而非指引。


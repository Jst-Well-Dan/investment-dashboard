name: spread-daily

# 股债收益差 · 每日取数 → 出页面 → 重出站点 → 提交
#
# 这条流水线以前在一个没有 git 的本地目录（20261122 五年看板）里靠双击 bat 跑，
# 因此经常断更：没人点就不更新，也没有异地备份。现在并进本仓库：
#   spread/scripts/  取数与出页面（原样搬来，路径无关）
#   spread/data/     CSV 缓存 + 抓取台账（跨运行状态，必须提交）
#   spread/docs/     中间产物（spread.html / status.html / data/latest.json）
# 本站构建再把 spread/docs/*.html 复制进 docs/research/valuation/ 上线。
#
# 为什么站点构建用 --partial：research.yaml 里 9 个研究页的 source 指向本机
# （Investment_Workflow 下的个股研究），云端拿不到。--partial 让这些页面沿用
# docs/ 里上次提交的副本，只重出「依赖数据、每天会变」的看板与首页/档案。
# 本地照旧跑全量 `python -m scripts.sitegen.build`，缺源会直接报错。

on:
  schedule:
    # 北京 18:10 / 20:10。东财的中债 10Y 与乐咕股债利差要收盘后才刷，
    # 18 点这拍多数时候已有当日值；20 点这拍兜住晚发布与前一拍失败。
    - cron: '10 10 * * 1-5'
    - cron: '10 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '全量重抓（忽略 TTL 缓存）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: spread-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            spread/requirements.txt

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r spread/requirements.txt

      - name: 取数 + 出 spread / status
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          args=""
          if [ "${{ inputs.force }}" = "true" ]; then args="--full"; fi
          python spread/scripts/run_daily.py $args

      - name: 首页读数搬运
        run: python scripts/pull_latest.py spread

      - name: 重出站点
        run: python -m scripts.sitegen.build --partial

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          day=$(python -c "import json;print(json.load(open('spread/docs/data/latest.json'))['day'])")
          git commit -m "data: 股债收益差更新至 ${day}" \
                     -m "spread/ 取数 + 出页面 → scripts/pull_latest.py 搬运读数 → 站点重建（--partial）。"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
